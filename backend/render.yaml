services:
  - type: web
    name: soma-backend
    env: node
    plan: free
    branch: main
    repo: https://github.com/jjingofarouk/soma
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false